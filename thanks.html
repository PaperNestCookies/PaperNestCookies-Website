<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ee"><title>Thank you | Paper Nest Cookies</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/assets/favicon.png"></head><body><div class="thanks-page"><a href="/" class="thanks-logo"><img src="/assets/logo.webp" alt="Paper Nest Cookies" width="260" height="260"></a><span class="eyebrow">THANK YOU FOR REACHING OUT</span><h1 id="thanks-title">Thanks for your message!</h1><p id="thanks-message">We've received your message and will be in touch.</p><a class="btn primary" href="/">Back to Paper Nest Cookies</a></div><script>const t=new URLSearchParams(location.search).get('type');if(t==='order'){document.getElementById('thanks-title').textContent='Thanks for your order request!';document.getElementById('thanks-message').textContent="We've received your cookie order request. We'll be in touch to confirm pickup details. Payment is due at pickup.";}else if(t==='event'){document.getElementById('thanks-title').textContent='Thanks for the invitation!';document.getElementById('thanks-message').textContent="We've received your event inquiry and will be in touch.";}</script></body></html>
